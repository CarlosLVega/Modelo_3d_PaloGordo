<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Recorrido 3D de la propuesta de la casa en Palo Gordo, San Cristóbal">
<title>Casa Palo Gordo</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: full-bleed 3D canvas; floating glass control rail on the left; note card bottom-right; HUD top-right. Single dark look. */
:root{
  --ink:#f3efe8; --mute:#a9a49b; --glass:rgba(20,22,25,.80); --glass2:rgba(20,22,25,.62);
  --line:rgba(255,255,255,.10); --chip:rgba(255,255,255,.06); --chip-h:rgba(255,255,255,.12);
  --accent:#e9a55c; --accent-ink:#1d1307; --bg:#0f1113;
  --f-ui:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.panel{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));
  width:286px;max-height:calc(100% - 32px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:auto;
  background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid var(--line);border-radius:14px;padding:16px;box-sizing:border-box;display:flex;flex-direction:column;gap:14px;z-index:5}
.brand h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.brand p{margin:4px 0 0;color:var(--mute);font-size:12.5px;line-height:1.4}
.sec{display:flex;flex-direction:column;gap:7px}
.sec h2{margin:0;font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.row{display:flex;flex-wrap:wrap;gap:6px}
button{font:inherit;font-size:12.5px;color:var(--ink);background:var(--chip);border:1px solid var(--line);border-radius:8px;
  padding:7px 10px;cursor:pointer;transition:background .15s,border-color .15s}
button:hover{background:var(--chip-h)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:rgba(0,0,0,.25);padding:3px;border-radius:9px}
.seg.two{grid-template-columns:1fr 1fr}
.seg button{border:0;background:transparent;padding:7px 4px}
.seg button.on{background:var(--accent)}
.lvl{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:baseline}
.go{display:flex;flex-direction:column;gap:4px}
.go button{display:flex;justify-content:space-between;align-items:baseline;text-align:left;gap:8px}
.go button span.m{font-family:var(--f-mono);font-size:11px;color:var(--mute)}
.go button.on span.m{color:var(--accent-ink)}
.doors{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.doors button{text-align:left;display:flex;gap:7px;align-items:center}
.dot{width:7px;height:7px;border-radius:50%;background:#6b6760;flex:none}
.doors button.open .dot{background:#7fd38b;box-shadow:0 0 8px #7fd38b}
.hud{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));
  background:var(--glass2);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);
  border-radius:10px;padding:8px 12px;font-family:var(--f-mono);font-size:12px;z-index:4;text-align:right;font-variant-numeric:tabular-nums}
.hud b{font-family:var(--f-ui);font-weight:600;font-size:13px;display:block}
.note{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));
  width:min(360px,calc(100% - 32px));background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-sizing:border-box;z-index:4}
.note h3{margin:0 0 6px;font-size:15px;font-weight:600;text-wrap:balance}
.note p{margin:0;color:#d6d1c8;font-size:13px;line-height:1.5}
.note .k{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px}
.note .k span{font-family:var(--f-mono);font-size:11px;background:var(--chip);border:1px solid var(--line);border-radius:6px;padding:3px 6px;color:var(--ink)}
.help{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));
  background:var(--glass2);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:12px;color:var(--ink);z-index:3;white-space:nowrap;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.help kbd{font-family:var(--f-mono);font-size:11px;background:rgba(255,255,255,.12);border-radius:4px;padding:1px 5px;margin:0 1px}
#cross{position:fixed;left:50%;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;z-index:3;pointer-events:none}
#cross::before,#cross::after{content:"";position:absolute;background:rgba(255,255,255,.85);box-shadow:0 0 3px rgba(0,0,0,.6)}
#cross::before{left:8px;top:2px;width:2px;height:14px}#cross::after{top:8px;left:2px;height:2px;width:14px}
#tip{position:fixed;z-index:6;pointer-events:none;background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:600;
  padding:5px 9px;border-radius:7px;transform:translate(12px,12px);white-space:nowrap}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:20;font-size:14px;color:var(--mute)}
#loading div{display:flex;flex-direction:column;align-items:center;gap:10px}
#loading i{width:160px;height:3px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden;position:relative}
#loading i::after{content:"";position:absolute;inset:0;width:40%;background:var(--accent);animation:ld 1.1s infinite ease-in-out}
@keyframes ld{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
#menuBtn{display:none}
.touch{position:fixed;bottom:calc(70px + env(safe-area-inset-bottom,0px));left:max(16px,env(safe-area-inset-left,0px));z-index:4;display:none;gap:8px;flex-direction:column}
.touch button{width:56px;height:56px;border-radius:50%;font-size:20px;background:var(--glass)}
@media (max-width:760px){
  .panel{top:auto;bottom:calc(12px + env(safe-area-inset-bottom,0px));left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));
    width:auto;max-height:58%;transform:translateY(calc(100% + 30px));transition:transform .3s}
  .panel.show{transform:none}
  #menuBtn{display:block;position:fixed;left:max(12px,env(safe-area-inset-left,0px));top:calc(12px + env(safe-area-inset-top,0px));z-index:6;background:var(--glass);font-weight:600}
  .note{display:none}
  .help{display:none}
  .hud{top:calc(12px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px))}
}
@media (prefers-reduced-motion:reduce){.panel{transition:none}#loading i::after{animation:none}}
</style>

<style>[hidden]{display:none!important}</style>
</head>
<body>
<canvas id="c" tabindex="0" aria-label="Recorrido 3D de la casa"></canvas>
<div id="loading"><div><span>Construyendo la casa…</span><i></i></div></div>
<button id="menuBtn" aria-controls="panel">☰ Menú</button>

<aside class="panel" id="panel">
  <div class="brand">
    <h1>Casa Palo Gordo</h1>
    <p>Propuesta de fachada, garaje y bajada · Palo Gordo, San Cristóbal · terreno 10 × 19 m</p>
  </div>

  <div class="sec">
    <h2>Modo</h2>
    <div class="seg two" id="modeSeg">
      <button data-mode="orbit" class="on">Vista libre</button>
      <button data-mode="walk">Caminar</button>
    </div>
  </div>

  <div class="sec">
    <h2>Ir a</h2>
    <div class="go" id="goList"></div>
  </div>

  <div class="sec">
    <h2>Abrir / cerrar</h2>
    <div class="doors" id="doorList"></div>
  </div>

  <div class="sec">
    <h2>Hora del día</h2>
    <div class="seg" id="timeSeg">
      <button data-t="day" class="on">Día</button>
      <button data-t="dusk">Atardecer</button>
      <button data-t="night">Noche</button>
    </div>
  </div>

  <div class="sec">
    <h2>Mostrar</h2>
    <div class="row" id="toggles">
      <button data-tg="cars" class="on">Carros</button>
      <button data-tg="labels" class="on">Medidas</button>
      <button data-tg="neigh" class="on">Casas vecinas</button>
      <button data-tg="roof" class="on">Techos y placas</button>
    </div>
  </div>
</aside>

<div class="hud" id="hud"><b id="hudLvl">Vista aérea</b><span id="hudSub">—</span></div>
<div class="note" id="note"><h3 id="noteT"></h3><p id="noteP"></p><div class="k" id="noteK"></div></div>
<div class="help" id="help"></div>
<div id="cross" hidden></div>
<div id="tip" hidden></div>
<div class="touch" id="touchPad"><button id="tFwd" aria-label="Avanzar">▲</button><button id="tBack" aria-label="Retroceder">▼</button></div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ============ Sistema de coordenadas ============
   x: 0 (lindero izquierdo, mirando desde la calle) → 10 (lindero derecho)
   d: profundidad del terreno, 0 = línea de calle → 19 = fondo. En three.js z = -d
   y: altura; 0 = placa de calle (planta 0) */
const L0 = 0, L1 = -2.65, L2 = -5.30, L3 = -7.94;
const isTouch = matchMedia('(pointer:coarse)').matches;

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance', logarithmicDepthBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.85;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.05, 7000);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const solids = [];        // colisión y piso al caminar
const interactive = [];   // mallas con acción
const allMats = [];
const groups = { cars: new THREE.Group(), labels: new THREE.Group(), neigh: new THREE.Group(), roof: new THREE.Group() };
Object.values(groups).forEach(g => scene.add(g));

/* ============ Texturas procedurales ============ */
let seed = 7;
const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
function ctex(size, draw, opts = {}) {
  const c = document.createElement('canvas'); c.width = size; c.height = opts.h || size;
  const g = c.getContext('2d'); draw(g, size, opts.h || size);
  const t = new THREE.CanvasTexture(c);

  if (!opts.linear) t.colorSpace = THREE.SRGBColorSpace;

function speck(g, w, h, n, cols, a, r0, r1) {
  for (let i = 0; i < n; i++) {
    g.globalAlpha = a * rnd(); g.fillStyle = cols[(rnd() * cols.length) | 0];
    const r = r0 + rnd() * (r1 - r0); g.fillRect(rnd() * w, rnd() * h, r, r);
  }

}
const T = {};
T.brick = ctex(512, (g, s) => {
  g.fillStyle = '#b9a99a'; g.fillRect(0, 0, s, s);
  const rh = s / 6, bw = s / 4, m = 5;
  for (let r = 0; r < 6; r++) for (let b = -1; b < 5; b++) {
    const off = (r % 2) * bw / 2; const x = b * bw + off;
    const v = rnd(); g.fillStyle = `rgb(${190 + v * 35 | 0},${88 + v * 30 | 0},${52 + v * 18 | 0})`;
    g.fillRect(x + m / 2, r * rh + m / 2, bw - m, rh - m);
    g.fillStyle = 'rgba(90,30,10,.18)'; g.fillRect(x + m / 2, r * rh + rh * .62, bw - m, rh * .3 - m / 2);
  }
  speck(g, s, s, 9000, ['#6b2a12', '#f0b28a', '#3a1a0a'], .25, 1, 3);
});
T.block = ctex(512, (g, s) => {
  g.fillStyle = '#8d8b86'; g.fillRect(0, 0, s, s);
  const rh = s / 6, bw = s / 3, m = 4;
  for (let r = 0; r < 6; r++) for (let b = -1; b < 4; b++) {

    g.fillStyle = `rgb(${150 + v},${148 + v},${142 + v})`; g.fillRect(x + m / 2, r * rh + m / 2, bw - m, rh - m);

T.concrete = ctex(512, (g, s) => {
  g.fillStyle = '#a3a19b'; g.fillRect(0, 0, s, s);
  for (let i = 0; i < 40; i++) { g.globalAlpha = .06; g.fillStyle = rnd() > .5 ? '#6f6c66' : '#c9c6bf'; g.beginPath(); g.arc(rnd() * s, rnd() * s, 20 + rnd() * 90, 0, 7); g.fill(); }

});
T.plaster = ctex(512, (g, s) => {
  g.fillStyle = '#efede8'; g.fillRect(0, 0, s, s);
  speck(g, s, s, 16000, ['#d8d5cf', '#ffffff', '#e2dfd8'], .5, 1, 2);
});
T.charcoal = ctex(512, (g, s) => {
  g.fillStyle = '#3b3e42'; g.fillRect(0, 0, s, s);
  speck(g, s, s, 40000, ['#2a2c2f', '#55595e', '#1e2023', '#4a4d52'], .55, 1, 2.5);
});
T.taupe = ctex(512, (g, s) => {
  g.fillStyle = '#9a8f82'; g.fillRect(0, 0, s, s);
  speck(g, s, s, 30000, ['#7e7468', '#b3a899', '#8a8073'], .45, 1, 2);
});
T.porcelain = ctex(512, (g, s) => {
  g.fillStyle = '#cfcbc4'; g.fillRect(0, 0, s, s);
  for (let i = 0; i < 2; i++) for (let j = 0; j < 2; j++) {
    const v = rnd() * 10 | 0; g.fillStyle = `rgb(${205 + v},${201 + v},${194 + v})`; g.fillRect(i * s / 2 + 2, j * s / 2 + 2, s / 2 - 4, s / 2 - 4);

T.stamped = ctex(512, (g, s) => {
  g.fillStyle = '#2b2d30'; g.fillRect(0, 0, s, s);
  let y = 0; while (y < s) { const h = 50 + rnd() * 70; let x = -rnd() * 80; while (x < s) { const w = 70 + rnd() * 120; const v = rnd() * 22 | 0; g.fillStyle = `rgb(${52 + v},${54 + v},${58 + v})`; g.fillRect(x + 3, y + 3, w - 6, h - 6); x += w; } y += h; }

T.wood = ctex(512, (g, s) => {
  const n = 8, bw = s / n;
  for (let i = 0; i < n; i++) {
    const v = rnd() * 26 | 0; g.fillStyle = `rgb(${132 + v},${86 + v * .7 | 0},${50 + v * .4 | 0})`; g.fillRect(i * bw, 0, bw, s);

T.marble = ctex(512, (g, s) => {
  g.fillStyle = '#141416'; g.fillRect(0, 0, s, s);
  for (let i = 0; i < 22; i++) {

  g.fillStyle = '#5d7f38'; g.fillRect(0, 0, s, s);
  speck(g, s, s, 60000, ['#4a6a2b', '#78984a', '#3d5a23', '#8aa85a', '#6b5a3a'], .55, 1, 3);
});
T.asphalt = ctex(1024, (g, s) => {
  g.fillStyle = '#77736d'; g.fillRect(0, 0, s, s);
  for (let i = 0; i < 30; i++) { g.globalAlpha = .08; g.fillStyle = rnd() > .5 ? '#5a5650' : '#9b968e'; g.beginPath(); g.arc(rnd() * s, rnd() * s, 40 + rnd() * 160, 0, 7); g.fill(); }

  g.strokeStyle = 'rgba(35,32,28,.75)';
  for (let i = 0; i < 26; i++) { let x = rnd() * s, y = rnd() * s; g.lineWidth = .8 + rnd() * 1.8; g.beginPath(); g.moveTo(x, y); for (let k = 0; k < 18; k++) { x += rnd() * 30 - 15; y += rnd() * 30 - 15; g.lineTo(x, y); } g.stroke(); }
});
T.dirt = ctex(512, (g, s) => {
  g.fillStyle = '#8c6a4c'; g.fillRect(0, 0, s, s);
  speck(g, s, s, 40000, ['#6d5038', '#a88a6a', '#c9b49a', '#5a4130'], .5, 1, 4);
});
T.cream = ctex(512, (g, s) => {
  g.fillStyle = '#e5ddb4'; g.fillRect(0, 0, s, s); speck(g, s, s, 15000, ['#cfc698', '#f2ecd0', '#b9b080'], .4, 1, 3);
  for (let i = 0; i < 25; i++) { g.globalAlpha = .07; g.fillStyle = '#6b6440'; g.fillRect(rnd() * s, rnd() * s, 3 + rnd() * 6, 40 + rnd() * 120); } g.globalAlpha = 1;
});
T.greenStone = ctex(512, (g, s) => {
  g.fillStyle = '#7f9d7a'; g.fillRect(0, 0, s, s);
  for (let i = 0; i < 90; i++) { const v = rnd() * 30 | 0; g.fillStyle = `rgb(${150 + v},${190 + v * .6 | 0},${145 + v})`; g.beginPath(); const x = rnd() * s, y = rnd() * s, r = 18 + rnd() * 30; g.ellipse(x, y, r, r * .7, rnd() * 3, 0, 7); g.fill(); }
  speck(g, s, s, 9000, ['#5c7a58'], .4, 1, 2);
});
T.tarp = ctex(256, (g, s) => {
  g.fillStyle = '#2a7fd6'; g.fillRect(0, 0, s, s);
  for (let i = 0; i < 30; i++) { g.globalAlpha = .12; g.fillStyle = rnd() > .5 ? '#0f4f99' : '#6fb0f0'; g.fillRect(0, rnd() * s, s, 2 + rnd() * 10); } g.globalAlpha = 1;
});

function setUV(geo, w, h, d, s) {
  const uv = geo.attributes.uv, dims = [[d, h], [d, h], [w, d], [w, d], [w, h], [w, h]];

}
// caja por esquinas (x, y, d). Devuelve la malla.
function BD(x1, y1, d1, x2, y2, d2, mat, o = {}) {

  const e = 0.0012 + rnd() * 0.0035;
  const w = Math.abs(x2 - x1) + 2 * e, h = Math.abs(y2 - y1) + 2 * e, dd = Math.abs(d2 - d1) + 2 * e;
  const geo = new THREE.BoxGeometry(w, h, dd);
  setUV(geo, w, h, dd, mat.userData?.s || 1);
  const m = new THREE.Mesh(geo, mat);
  m.position.set((x1 + x2) / 2, (y1 + y2) / 2, -(d1 + d2) / 2);
  m.castShadow = o.cast !== false; m.receiveShadow = true;
  (o.parent || scene).add(m);
  if (o.solid !== false) solids.push(m);
  return m;
}

}

const sx = x => -0.15 - 0.045 * Math.max(-60, Math.min(60, x));

function terrain(x0, x1, d0, d1, nx, nd, fn, colorFn, tex, rep) {

    const y = fn(x, d); p.setXYZ(i, x, y, z);

const actions = {};
function registerAction(key, label, group, apply, speed) {
  const a = { key, label, open: false, t: 0, speed, apply };
  group.traverse(o => { if (o.isMesh) { o.userData.action = key; interactive.push(o); } });
  actions[key] = a; return a;
}
// puerta batiente: axis 'x' → hoja a lo largo de +x desde la bisagra; 'd' → hoja hacia +d
function swingDoor(key, label, hx, y0, hd, width, height, axis, sign, buildLeaf, maxA = 1.45) {
  const pivot = new THREE.Group(); pivot.position.set(hx, y0, -hd); scene.add(pivot);
  const leaf = new THREE.Group(); pivot.add(leaf);
  buildLeaf(leaf, width, height);
  leaf.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; solids.push(o); } });
  registerAction(key, label, pivot, t => { pivot.rotation.y = sign * maxA * t; }, 1.4);
}
function leafBox(parent, axis, w, h, th, mat, u0 = 0, v0 = 0, uw = w, vh = h, off = 0) {
  const g = axis === 'x' ? new THREE.BoxGeometry(uw, vh, th) : new THREE.BoxGeometry(th, vh, uw);
  if (mat.userData?.s) setUV(g, axis === 'x' ? uw : th, vh, axis === 'x' ? th : uw, mat.userData.s);
  const m = new THREE.Mesh(g, mat);
  if (axis === 'x') m.position.set(u0 + uw / 2, v0 + vh / 2, off); else m.position.set(off, v0 + vh / 2, -(u0 + uw / 2));
  parent.add(m); return m;
}

function plant(x, y, d, s, type) {
  const grp = new THREE.Group(); grp.position.set(x, y, -d);
  if (type === 'bush') {
    for (let i = 0; i < 3; i++) { const m = new THREE.Mesh(geoIco, i ? M.leaf2 : M.leaf); m.scale.setScalar(s * (0.28 + rnd() * 0.12)); m.position.set((rnd() - .5) * s * .4, s * (0.22 + rnd() * .12), (rnd() - .5) * s * .4); m.castShadow = true; grp.add(m); }
  } else if (type === 'spiky' || type === 'tall') {
    const n = type === 'tall' ? 14 : 10, hh = type === 'tall' ? 1.3 : 0.75;
    for (let i = 0; i < n; i++) {
      const m = new THREE.Mesh(geoCone, i % 3 ? M.leaf2 : M.leafDark); const a = rnd() * Math.PI * 2, tilt = 0.25 + rnd() * 0.7;
      m.scale.set(s, s * hh * (0.7 + rnd() * .5), s); m.position.y = s * hh * 0.4;
      m.rotation.set(Math.cos(a) * tilt, 0, Math.sin(a) * tilt); m.castShadow = true; grp.add(m);
    }
  }
  scene.add(grp); return grp;
}
// árboles instanciados
function forest(count, accept, sizeFn) {
  const canopy = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(1, 1), std({ color: 0xffffff, roughness: .95, flatShading: true }), count * 2);
  const trunk = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.12, 0.18, 1, 6), std({ color: 0x5a4330, roughness: 1 }), count);
  const mtx = new THREE.Matrix4(), q = new THREE.Quaternion(), col = new THREE.Color();
  let n = 0, nc = 0, tries = 0;
  while (n < count && tries < count * 30) {
    tries++;
    const p = accept(); if (!p) continue;
    const [x, d] = p; const y = G(x, d); const s = sizeFn(d);
    const th = s * (1.2 + rnd() * 1.5);
    mtx.compose(new THREE.Vector3(x, y + th / 2, -d), q, new THREE.Vector3(s * .5, th, s * .5)); trunk.setMatrixAt(n, mtx);
    for (let k = 0; k < 2; k++) {
      const r = s * (1.1 + rnd() * 0.8);
      q.setFromEuler(new THREE.Euler(rnd(), rnd() * 6, rnd()));
      mtx.compose(new THREE.Vector3(x + (rnd() - .5) * s, y + th + r * (0.5 + k * 0.6), -d + (rnd() - .5) * s), q, new THREE.Vector3(r, r * (0.8 + rnd() * .4), r));
      canopy.setMatrixAt(nc, mtx);
      col.setHSL(0.24 + rnd() * 0.08, 0.45 + rnd() * 0.25, 0.22 + rnd() * 0.14); canopy.setColorAt(nc, col); nc++;
    }
    q.identity(); n++;
  }
  trunk.count = n; canopy.count = nc; canopy.castShadow = true; trunk.castShadow = true; canopy.receiveShadow = true;
  scene.add(trunk, canopy);
}

function box(parent, w, h, l, x, y, z, mat) { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, l), mat); m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true; parent.add(m); return m; }
// carrocería por perfil lateral: pts = [largo, alto], frente en largo negativo (hacia -z)
function sideBody(parent, pts, width, mat, bevel = 0.05) {
  const s = new THREE.Shape(); s.moveTo(pts[0][0], pts[0][1]); for (const p of pts.slice(1)) s.lineTo(p[0], p[1]); s.closePath();
  const depth = Math.max(0.01, width - 2 * bevel);
  const g = new THREE.ExtrudeGeometry(s, { depth, bevelEnabled: bevel > 0, bevelThickness: bevel, bevelSize: bevel, bevelSegments: 4, curveSegments: 4 });
  g.translate(0, 0, -depth / 2); g.rotateY(-Math.PI / 2);
  const m = new THREE.Mesh(g, mat); m.castShadow = true; m.receiveShadow = true; parent.add(m); return m;
}
function decal(parent, text, w, h, x, y, z, side) {
  const tex = textTex([text], 512, 128, '#111', 'italic 800 84px Archivo, sans-serif');
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshStandardMaterial({ map: tex, transparent: true, roughness: .5 }));
  m.position.set(x, y, z); m.rotation.y = side * Math.PI / 2; parent.add(m);

// perfil con curvas y arcos de rueda: cmds = ['m',u,v] ['l',u,v] ['q',cu,cv,u,v] ['arc',cu,cv,r,a0,a1]
function extr(parent, cmds, width, mat, bevel = 0.05) {
  const s = new THREE.Shape();
  for (const c of cmds) {
    if (c[0] === 'm') s.moveTo(c[1], c[2]);
    else if (c[0] === 'l') s.lineTo(c[1], c[2]);
    else if (c[0] === 'q') s.quadraticCurveTo(c[1], c[2], c[3], c[4]);
    else if (c[0] === 'arc') s.absarc(c[1], c[2], c[3], c[4], c[5], false);
  }
  const depth = Math.max(0.01, width - 2 * bevel);
  const g = new THREE.ExtrudeGeometry(s, { depth, bevelEnabled: bevel > 0, bevelThickness: bevel, bevelSize: bevel, bevelSegments: 5, curveSegments: 14 });
  g.translate(0, 0, -depth / 2); g.rotateY(-Math.PI / 2);
  const m = new THREE.Mesh(g, mat); m.castShadow = true; m.receiveShadow = true; parent.add(m); return m;
}
// arco negro de guardafango (moldura) alrededor de la rueda
function flare(parent, x, cz, cy, r, a0, tube, mat) {
  const geo = new THREE.TorusGeometry(r, tube, 8, 28, Math.PI - 2 * a0);
  geo.rotateZ(a0); geo.rotateY(Math.PI / 2);
  const m = new THREE.Mesh(geo, mat); m.position.set(x, cy, cz); m.castShadow = true; parent.add(m);
}

function label(text, sub, x, y, d, scale = 1) {
  const w = 1024, h = 256;
  const tex = ctex(w, g => {
    g.fillStyle = 'rgba(18,19,22,.86)'; const r = 40; g.beginPath(); g.roundRect(8, 8, w - 16, h - 16, r); g.fill();
    g.strokeStyle = 'rgba(233,165,92,.9)'; g.lineWidth = 5; g.stroke();
    g.fillStyle = '#f3efe8'; g.font = '600 78px Archivo, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(text, w / 2, sub ? 95 : h / 2);
    if (sub) { g.fillStyle = '#e9a55c'; g.font = '500 52px "IBM Plex Mono", monospace'; g.fillText(sub, w / 2, 175); }
  }, { h });
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, fog: false }));
  sp.position.set(x, y, -d); sp.scale.set(2.6 * scale, 0.65 * scale, 1); sp.renderOrder = 10; groups.labels.add(sp); return sp;
}

const goList = document.getElementById('goList');
VIEWS.forEach(v => {

const doorList = document.getElementById('doorList');
['porton', 'portico', 'escalera', 'casa', 'apto', 'n2', 'n3'].forEach(k => {
  const b = document.createElement('button'); b.dataset.a = k; b.innerHTML = `<span class="dot"></span>${actions[k].label}`;
  b.onclick = () => toggleAction(k); doorList.appendChild(b);
});
function toggleAction(k) { const a = actions[k]; a.open = !a.open; refreshDoorButtons(); }

let tween = null;
function setNote(v) {
  document.getElementById('noteT').textContent = v.t; document.getElementById('noteP').textContent = v.p;
  document.getElementById('noteK').innerHTML = v.k.map(s => `<span>${s}</span>`).join('');

}

}

/* ---- caminar: piso y colisiones ---- */
const rc = new THREE.Raycaster();
const DOWN = new THREE.Vector3(0, -1, 0);
function groundAt(x, z, fromY) {
  rc.set(new THREE.Vector3(x, fromY, z), DOWN); rc.far = 200;
  const hits = rc.intersectObjects(solids, false);
  let y = nearG(x, -z);
  for (const h of hits) { if (h.object.material === M.glassRail || h.object.material === M.glass) continue; if (h.point.y > y) { y = h.point.y; } break; }
  return Math.max(y, nearG(x, -z));
}
function blockedMove(from, dir, dist) {
  for (const hgt of [0.45, 1.2, 1.7]) {
    rc.set(new THREE.Vector3(from.x, from.y + hgt, from.z), dir); rc.far = dist + 0.3;
    const hit = rc.intersectObjects(solids, false)[0];

  }
  return false;
}
function updateWalk(dt) {

  let f = (k.KeyW || k.ArrowUp || touchMove.f ? 1 : 0) - (k.KeyS || k.ArrowDown || touchMove.b ? 1 : 0);
  let s = (k.KeyD || k.ArrowRight ? 1 : 0) - (k.KeyA || k.ArrowLeft ? 1 : 0);
  const speed = 2.1 * run * dt;
  const fwd = new THREE.Vector3(-Math.sin(walk.yaw), 0, -Math.cos(walk.yaw)), right = new THREE.Vector3(Math.cos(walk.yaw), 0, -Math.sin(walk.yaw));

    mv.normalize().multiplyScalar(speed);

  if (walk.pos.y > g + 0.02) { walk.vy -= 9.8 * dt; walk.pos.y = Math.max(g, walk.pos.y + walk.vy * dt); }
  else { walk.vy = 0; walk.pos.y += (g - walk.pos.y) * Math.min(1, dt * 14); }

  camera.rotation.set(walk.pitch, walk.yaw, 0, 'YXZ');

/* ---- modo ---- */
const help = document.getElementById('help'), cross = document.getElementById('cross');

  orbit.enabled = m === 'orbit';
  cross.hidden = m !== 'walk';
  document.getElementById('touchPad').style.display = (m === 'walk' && isTouch) ? 'flex' : 'none';
  if (m === 'walk') {
    if (!skipPlace) { const cur = goList.querySelector('button.on')?.dataset.v; const v = VIEWS.find(x => x.id === cur && x.walk) || VIEWS.find(x => x.id === 'calle'); placeWalk(v); setNote(v); }
    help.innerHTML = isTouch ? 'Arrastra para mirar · ▲▼ para caminar · toca una puerta para abrirla'
      : 'Clic para mirar con el mouse · <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> caminar · <kbd>Shift</kbd> correr · <kbd>E</kbd> o clic abre puertas · <kbd>Esc</kbd> soltar mouse';
  } else {
    if (document.pointerLockElement) document.exitPointerLock();
    camera.rotation.order = 'XYZ';
    orbit.target.set(walk.pos.x - Math.sin(walk.yaw) * 4, camera.position.y - 0.5, walk.pos.z - Math.cos(walk.yaw) * 4);
    help.innerHTML = isTouch ? 'Un dedo gira · dos dedos acercan · toca puertas y portón' : 'Arrastra para girar · rueda para acercar · clic derecho para desplazar · clic en puertas y portón';
  }
}
document.querySelectorAll('#modeSeg button').forEach(b => b.onclick = () => setMode(b.dataset.mode));
document.querySelectorAll('#timeSeg button').forEach(b => b.onclick = () => { document.querySelectorAll('#timeSeg button').forEach(x => x.classList.toggle('on', x === b)); setTime(b.dataset.t); });
document.querySelectorAll('#toggles button').forEach(b => b.onclick = () => { b.classList.toggle('on'); const g = groups[b.dataset.tg]; g.visible = b.classList.contains('on'); });
const panel = document.getElementById('panel');
document.getElementById('menuBtn').onclick = () => panel.classList.toggle('show');

/* ---- entrada ---- */
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return; walk.keys[e.code] = true;
  if (mode === 'walk' && e.code === 'KeyE') useCenter();
  if (mode === 'walk' && ['ArrowUp', 'ArrowDown', 'Space'].includes(e.code)) e.preventDefault();
});
addEventListener('keyup', e => { walk.keys[e.code] = false; });
addEventListener('blur', () => { walk.keys = {}; });
let down = null, dragLook = false;
canvas.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY, t: performance.now() }; dragLook = mode === 'walk' && !document.pointerLockElement; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove', e => {
  if (mode === 'walk') {
    if (document.pointerLockElement === canvas) look(e.movementX, e.movementY);
    else if (dragLook && down) look(e.movementX * 1.4, e.movementY * 1.4);
  } else hover(e);
});
canvas.addEventListener('pointerup', e => {
  if (!down) return; const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y) > 6; down = null; dragLook = false;
  if (moved) return;
  if (mode === 'walk') {
    if (document.pointerLockElement === canvas) useCenter();
    else if (!pick(e.clientX, e.clientY) && !isTouch) { try { const p = canvas.requestPointerLock(); if (p && p.catch) p.catch(() => {}); } catch (_) {} }
  } else pick(e.clientX, e.clientY);
});
function look(dx, dy) { walk.yaw -= dx * 0.0022; walk.pitch = THREE.MathUtils.clamp(walk.pitch - dy * 0.0022, -1.35, 1.35); }
const ndc = new THREE.Vector2();
function pick(cx, cy) {
  ndc.set(cx / innerWidth * 2 - 1, -(cy / innerHeight) * 2 + 1); rc.setFromCamera(ndc, camera); rc.far = mode === 'walk' ? 4 : 400;
  const h = rc.intersectObjects(solids, false)[0];
  if (h && h.object.userData.action) { toggleAction(h.object.userData.action); return true; } return false;
}
function useCenter() { pick(innerWidth / 2, innerHeight / 2); }
const tip = document.getElementById('tip');
function hover(e) {
  ndc.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); rc.setFromCamera(ndc, camera); rc.far = 400;
  const h = rc.intersectObjects(solids, false)[0]; const a = h && h.object.userData.action;
  if (a) { tip.hidden = false; tip.style.left = e.clientX + 'px'; tip.style.top = e.clientY + 'px'; tip.textContent = (actions[a].open ? 'Cerrar ' : 'Abrir ') + actions[a].label.toLowerCase(); canvas.style.cursor = 'pointer'; }
  else { tip.hidden = true; canvas.style.cursor = ''; }
}
// táctil: botones avanzar/retroceder
const touchMove = { f: false, b: false };
for (const [id, k] of [['tFwd', 'f'], ['tBack', 'b']]) {
  const el = document.getElementById(id);
  el.addEventListener('pointerdown', e => { e.preventDefault(); touchMove[k] = true; });
  for (const ev of ['pointerup', 'pointerleave', 'pointercancel']) el.addEventListener(ev, () => touchMove[k] = false);
}

/* ---- HUD de nivel ---- */
const hudLvl = document.getElementById('hudLvl'), hudSub = document.getElementById('hudSub');
function levelName(y) {
  if (y > 2.6) return ['Piso 1 · casa', 'N +2,90'];
  if (y > -1.0) return ['Planta 0 · calle', 'N ±0,00'];
  if (y > -3.9) return ['Planta −1', 'N −2,65'];
  if (y > -6.6) return ['Planta −2', 'N −5,30'];
  if (y > -9.5) return ['Planta −3', 'N −7,94'];
  return ['Ladera', ''];
}

/* ---- bucle ---- */
const clock = new THREE.Clock();
function animate() {
  const dt = Math.min(0.05, clock.getDelta());
  for (const a of Object.values(actions)) {
    const target = a.open ? 1 : 0;
    if (a.t !== target) { a.t += Math.sign(target - a.t) * dt * a.speed; a.t = THREE.MathUtils.clamp(a.t, 0, 1); if (Math.abs(a.t - target) < 0.002) a.t = target; }
    const e = a.t < .5 ? 2 * a.t * a.t : 1 - Math.pow(-2 * a.t + 2, 2) / 2; a.apply(e);
  }
  if (mode === 'walk') {
    updateWalk(dt);
    const [n, s] = levelName(walk.pos.y); hudLvl.textContent = n; hudSub.textContent = s + ' · caminando';
  } else {
    if (tween) {
      tween.t = Math.min(1, tween.t + dt / 1.4); const e = 1 - Math.pow(1 - tween.t, 3);
      camera.position.lerpVectors(tween.p0, tween.p1, e); orbit.target.lerpVectors(tween.t0, tween.t1, e);
      if (tween.t >= 1) tween = null;
    }
    orbit.update();
    const [n, s] = levelName(orbit.target.y); hudLvl.textContent = n; hudSub.textContent = s + ' · vista libre';
  }
  for (const sp of groups.labels.children) sp.visible = sp.position.distanceTo(camera.position) > 7.5;
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
function fitCamera() { camera.aspect = innerWidth / innerHeight; camera.fov = camera.aspect < 1 ? 72 : 58; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); }
addEventListener('resize', fitCamera); fitCamera();

window.__app = { goTo, setMode, setTime, toggleAction, walk, camera, orbit, render: () => { orbit.update(); renderer.render(scene, camera); } };
